<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <defs>
    <linearGradient id="grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#0f6db5"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect x="40" y="40" width="640" height="340" rx="24" fill="#ffffff" stroke="#9aa4b2" stroke-opacity="0.35"/>

  <!-- Header line -->
  <rect x="86" y="84" width="220" height="14" rx="7" fill="#9aa4b2" opacity="0.35"/>
  <rect x="86" y="112" width="140" height="10" rx="5" fill="#9aa4b2" opacity="0.25"/>

  <!-- Empty list rows (ghost) -->
  <g opacity="0.35">
    <rect x="86" y="160" width="548" height="54" rx="14" fill="#9aa4b2" opacity="0.18"/>
    <rect x="86" y="226" width="548" height="54" rx="14" fill="#9aa4b2" opacity="0.14"/>
    <rect x="86" y="292" width="548" height="54" rx="14" fill="#9aa4b2" opacity="0.10"/>
  </g>

  <!-- Central icon: user group -->
  <g transform="translate(360 235)">
    <!-- Ring -->
    <circle cx="0" cy="0" r="78" fill="none" stroke="url(#grad)" stroke-width="12" opacity="0.18"/>
    <!-- Main user -->
    <circle cx="-18" cy="-18" r="18" fill="url(#grad)" opacity="0.9"/>
    <path d="M-52,52 C-52,26 -35,10 -18,10 C-1,10 16,26 16,52" fill="url(#grad)" opacity="0.45"/>
    <!-- Secondary user -->
    <circle cx="36" cy="-10" r="14" fill="#0f6db5" opacity="0.65"/>
    <path d="M10,52 C12,30 24,18 36,18 C48,18 60,30 62,52" fill="#0f6db5" opacity="0.28"/>
    <!-- Plus -->
    <g opacity="0.9">
      <circle cx="64" cy="-52" r="16" fill="#2ecc71"/>
      <path d="M64,-60 V-44 M56,-52 H72" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Caption -->
  <text x="360" y="360" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="18" fill="#2b2f36" opacity="0.85">
    No engineers yet
  </text>
  <text x="360" y="386" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="14" fill="#9aa4b2">
    Invite engineers to start scheduling and assignments
  </text>
</svg>
