<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <defs>
    <linearGradient id="grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#0f6db5"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect x="40" y="40" width="640" height="340" rx="24" fill="#ffffff" stroke="#9aa4b2" stroke-opacity="0.35"/>

  <!-- Header -->
  <rect x="86" y="84" width="260" height="14" rx="7" fill="#9aa4b2" opacity="0.35"/>
  <rect x="86" y="112" width="170" height="10" rx="5" fill="#9aa4b2" opacity="0.25"/>

  <!-- Calendar grid (ghost) -->
  <g opacity="0.28">
    <rect x="86" y="150" width="548" height="200" rx="18" fill="#9aa4b2" opacity="0.06"/>
    <!-- Grid lines -->
    <path d="M86 198 H634 M86 246 H634 M86 294 H634" stroke="#9aa4b2" stroke-opacity="0.25"/>
    <path d="M168 150 V350 M250 150 V350 M332 150 V350 M414 150 V350 M496 150 V350 M578 150 V350" stroke="#9aa4b2" stroke-opacity="0.20"/>
  </g>

  <!-- Central icon: calendar + moon (time off) -->
  <g transform="translate(360 235)">
    <circle cx="0" cy="0" r="78" fill="none" stroke="url(#grad)" stroke-width="12" opacity="0.18"/>
    <!-- Calendar -->
    <rect x="-46" y="-40" width="92" height="92" rx="16" fill="#0f6db5" opacity="0.16" stroke="#0f6db5" stroke-opacity="0.35"/>
    <rect x="-46" y="-40" width="92" height="24" rx="16" fill="#2ecc71" opacity="0.35"/>
    <circle cx="-20" cy="-28" r="5" fill="#ffffff" opacity="0.85"/>
    <circle cx="20" cy="-28" r="5" fill="#ffffff" opacity="0.85"/>

    <!-- Crescent moon -->
    <g transform="translate(52 46)">
      <circle cx="0" cy="0" r="16" fill="url(#grad)" opacity="0.95"/>
      <circle cx="6" cy="-2" r="14" fill="#ffffff" opacity="0.95"/>
    </g>
  </g>

  <!-- Caption -->
  <text x="360" y="360" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="18" fill="#2b2f36" opacity="0.85">
    No time off requests
  </text>
  <text x="360" y="386" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="14" fill="#9aa4b2">
    Requests will appear here for approval and tracking
  </text>
</svg>
