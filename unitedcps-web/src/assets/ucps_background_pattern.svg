<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="ucpsGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#0f6db5"/>
    </linearGradient>

    <!-- A single "curved mark" element (your swoosh) -->
    <symbol id="curvedMark" viewBox="0 0 320 200">
      <!-- Outer arc -->
      <path d="M30,140 C90,40 230,20 300,95"
            fill="none" stroke="url(#ucpsGrad)" stroke-width="18" stroke-linecap="round" opacity="0.10"/>
      <!-- Inner arc -->
      <path d="M55,150 C115,65 225,50 280,105"
            fill="none" stroke="url(#ucpsGrad)" stroke-width="10" stroke-linecap="round" opacity="0.08"/>
      <!-- Small dots -->
      <circle cx="95" cy="85" r="6" fill="url(#ucpsGrad)" opacity="0.10"/>
      <circle cx="250" cy="115" r="6" fill="url(#ucpsGrad)" opacity="0.10"/>
    </symbol>

    <!-- Repeatable pattern -->
    <pattern id="ucpsPattern" width="320" height="320" patternUnits="userSpaceOnUse">
      <!-- Place a few marks per tile with gentle rotation -->
      <use href="#curvedMark" x="0" y="40" transform="rotate(-12 160 160)"/>
      <use href="#curvedMark" x="-40" y="160" transform="rotate(18 160 160)"/>
      <use href="#curvedMark" x="40" y="-70" transform="rotate(8 160 160)"/>
    </pattern>
  </defs>

  <!-- Transparent background, pattern only -->
  <rect width="100%" height="100%" fill="url(#ucpsPattern)"/>
</svg>
