<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#0f6db5"/>
    </linearGradient>

    <!-- Soft glow via blur -->
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Transparent background -->
  <rect width="1920" height="600" fill="transparent"/>

  <!-- Big, low-opacity sweeps for a hero section -->
  <path d="M-120,520 C420,120 980,40 2120,240"
        fill="none" stroke="url(#heroGrad)" stroke-width="46" stroke-linecap="round" opacity="0.10"/>
  <path d="M-60,560 C520,200 1080,140 2100,320"
        fill="none" stroke="url(#heroGrad)" stroke-width="28" stroke-linecap="round" opacity="0.07"/>

  <!-- Subtle accent dots -->
  <g opacity="0.10" filter="url(#softBlur)">
    <circle cx="420" cy="210" r="10" fill="#2ecc71"/>
    <circle cx="1380" cy="280" r="10" fill="#0f6db5"/>
    <circle cx="980" cy="170" r="8" fill="url(#heroGrad)"/>
  </g>

  <!-- Extra faint corner mark (top-right) -->
  <path d="M1280,40 C1520,10 1760,70 1960,180"
        fill="none" stroke="url(#heroGrad)" stroke-width="22" stroke-linecap="round" opacity="0.06"/>
</svg>
